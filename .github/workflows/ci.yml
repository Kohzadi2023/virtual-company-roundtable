name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Gate on what ships to users. Build and dev tooling (tailwind, vite,
      # vitest, ...) never reaches the deployed app, and an advisory with no
      # patched release (e.g. braces, GHSA-vfj7-8cjw-p6xm) in that tooling would
      # otherwise fail every pull request until upstream publishes a fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Still visible, but advisory only.
      - name: Audit dev dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Run tests
        run: npm run test:run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
