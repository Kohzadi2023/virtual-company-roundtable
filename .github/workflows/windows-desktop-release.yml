name: Windows Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in a manual desktop build
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $rawVersion = $env:RELEASE_TAG
          } else {
            $rawVersion = $env:MANUAL_VERSION
          }

          $version = $rawVersion -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release version '$rawVersion' is not valid SemVer."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $tauriPath = 'frontend/src-tauri/tauri.conf.json'
          $config = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 30 | Set-Content $tauriPath -Encoding utf8

          $cargoPath = 'frontend/src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$version`"", 1)
          Set-Content $cargoPath $cargo -Encoding utf8

      - name: Detect Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL_INPUT: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          $enabled = $hasCertificate -and $hasPassword
          $enabledText = $enabled.ToString().ToLowerInvariant()
          "WINDOWS_CODE_SIGNING=$enabledText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL_INPUT
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }
          "WINDOWS_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($enabled) {
            Write-Host 'Windows Authenticode signing is enabled for this build.' -ForegroundColor Green
          } else {
            Write-Warning 'WINDOWS_CERTIFICATE_BASE64 and/or WINDOWS_CERTIFICATE_PASSWORD are not configured. The installer will be unsigned.'
            if ($env:GITHUB_STEP_SUMMARY) {
              '### Windows Authenticode signing' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              'Signing: **disabled** — add `WINDOWS_CERTIFICATE_BASE64` and `WINDOWS_CERTIFICATE_PASSWORD` repository secrets to produce signed releases.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }

      - name: Import signing certificate and configure Tauri
        if: env.WINDOWS_CODE_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          ./scripts/import-windows-signing-certificate.ps1 `
            -CertificateBase64 $env:WINDOWS_CERTIFICATE_BASE64 `
            -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD `
            -TauriConfigPath 'frontend/src-tauri/tauri.conf.json' `
            -TimestampUrl $env:WINDOWS_TIMESTAMP_URL

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Generate desktop icons
        working-directory: frontend
        run: npm run tauri -- icon src-tauri/app-icon.svg

      - name: Build FastAPI sidecar
        shell: pwsh
        run: ./scripts/build-desktop-backend.ps1 -Python python -TargetTriple x86_64-pc-windows-msvc

      - name: Sign FastAPI sidecar
        if: env.WINDOWS_CODE_SIGNING == 'true'
        shell: pwsh
        run: |
          ./scripts/sign-windows-file.ps1 `
            -FilePath 'frontend/src-tauri/binaries/virtual-company-backend-x86_64-pc-windows-msvc.exe' `
            -Thumbprint $env:WINDOWS_CERT_THUMBPRINT `
            -TimestampUrl $env:WINDOWS_TIMESTAMP_URL

      - name: Build NSIS installer
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8765
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc

      - name: Stage installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          }
          if (-not $installer) { throw 'NSIS installer was not produced.' }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $destination = Join-Path 'release' ("VirtualCompany_{0}_x64-setup.exe" -f $env:APP_VERSION)
          Copy-Item $installer.FullName $destination -Force
          Write-Host "Staged $destination"

      - name: Verify signed desktop binaries
        if: env.WINDOWS_CODE_SIGNING == 'true'
        shell: pwsh
        run: |
          $appExe = 'frontend/src-tauri/target/x86_64-pc-windows-msvc/release/virtual-company.exe'
          if (-not (Test-Path $appExe)) {
            $appExe = 'frontend/src-tauri/target/release/virtual-company.exe'
          }
          if (-not (Test-Path $appExe)) { throw 'Tauri application executable was not found for signature verification.' }

          $installer = Get-ChildItem 'release/VirtualCompany_*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Staged installer was not found for signature verification.' }

          ./scripts/sign-windows-file.ps1 -FilePath $appExe -VerifyOnly
          ./scripts/sign-windows-file.ps1 -FilePath $installer.FullName -VerifyOnly

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCompany-${{ env.APP_VERSION }}-windows-x64
          path: release/VirtualCompany_*_x64-setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $installer = Get-ChildItem 'release/VirtualCompany_*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer asset not found.' }
          gh release upload $env:RELEASE_TAG $installer.FullName --clobber

      - name: Remove imported signing certificate
        if: always() && env.WINDOWS_CODE_SIGNING == 'true'
        shell: pwsh
        run: |
          $certificatePath = "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT"
          if (Test-Path $certificatePath) {
            Remove-Item $certificatePath -Force
            Write-Host 'Removed temporary code-signing certificate from the runner certificate store.'
          }
