name: Repo hygiene lockfile generation

on:
  push:
    branches:
      - chore/repo-hygiene-lockfiles

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: ${{ !contains(github.event.head_commit.message, '[repo-hygiene-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repo-hygiene-lockfiles

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync npm lockfile metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Cargo.lock
        working-directory: frontend/src-tauri
        run: cargo generate-lockfile

      - name: Commit generated lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git commit -m "chore(repo): sync npm and Cargo lockfiles [repo-hygiene-generated]"
          git push origin HEAD:chore/repo-hygiene-lockfiles
