<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Virtual Company Roundtable Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #1e293b;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    p {
      margin: 4px 0;
      color: #475569;
      line-height: 1.4;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 600;
    }
    .status.on { background: #dcfce7; color: #166534; }
    .status.off { background: #f1f5f9; color: #64748b; }
    ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <h1>Virtual Company Roundtable Bridge</h1>
  <p>Captures the latest AI reply on this tab and sends it to your open Virtual Company Roundtable tab.</p>
  <div id="status" class="status off">Checking this tab…</div>
  <p style="margin-top:10px;"><strong>ChatGPT</strong> captures automatically. On the other supported sites, use the floating "↩ Send to Virtual Company" button once a reply finishes.</p>
  <script src="popup.js"></script>
</body>
</html>
